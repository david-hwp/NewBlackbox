<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>算力管家 - Android 应用原型</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .page-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .page-title h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #fff;
    }

    .page-title p {
      font-size: 15px;
      color: #94a3b8;
    }

    .screens {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .screen-card {
      text-align: center;
    }

    .screen-label {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    /* 手机外壳 */
    .phone-shell {
      width: 432px;
      height: 880px;
      background: #1e293b;
      border-radius: 40px;
      padding: 12px;
      box-shadow:
        0 0 0 2px #334155,
        0 28px 60px -12px rgba(0,0,0,0.6);
      position: relative;
    }

    /* 前置摄像头挖孔 */
    .phone-shell::before {
      content: '';
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 20px;
      background: #0f172a;
      border-radius: 10px;
      z-index: 10;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      border-radius: 32px;
      overflow: hidden;
      background: #000;
    }

    .phone-screen iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="page-title">
    <h1>多店管家</h1>
    <p>Android 应用原型 · 5 个屏幕</p>
  </div>

  <div class="screens">
    <div class="screen-card">
      <div class="screen-label">登录页</div>
      <div class="phone-shell">
        <div class="phone-screen">
          <iframe src="screens/login.html" loading="lazy"></iframe>
        </div>
      </div>
    </div>

    <div class="screen-card">
      <div class="screen-label">首页 · 店铺管理</div>
      <div class="phone-shell">
        <div class="phone-screen">
          <iframe src="screens/home.html" loading="lazy"></iframe>
        </div>
      </div>
    </div>

    <div class="screen-card">
      <div class="screen-label">个人中心</div>
      <div class="phone-shell">
        <div class="phone-screen">
          <iframe src="screens/profile.html" loading="lazy"></iframe>
        </div>
      </div>
    </div>

    <div class="screen-card">
      <div class="screen-label">算力充值与转让</div>
      <div class="phone-shell">
        <div class="phone-screen">
          <iframe src="screens/trade.html" loading="lazy"></iframe>
        </div>
      </div>
    </div>

    <div class="screen-card">
      <div class="screen-label">店铺操作日志</div>
      <div class="phone-shell">
        <div class="phone-screen">
          <iframe src="screens/logs.html" loading="lazy"></iframe>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
