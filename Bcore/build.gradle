plugins {
    id 'com.android.application'
    alias(libs.plugins.jetbrains.kotlin.android)
}

def engineVersionCodeOverride = project.hasProperty("ENGINE_VERSION_CODE")
        ? project.property("ENGINE_VERSION_CODE")
        : project.hasProperty("APP_VERSION_CODE")
        ? project.property("APP_VERSION_CODE")
        : project.hasProperty("DUODIAN_APP_VERSION_CODE")
        ? project.property("DUODIAN_APP_VERSION_CODE")
        : rootProject.ext.versionCode
def engineVersionNameOverride = project.hasProperty("ENGINE_VERSION_NAME")
        ? project.property("ENGINE_VERSION_NAME")
        : project.hasProperty("APP_VERSION_NAME")
        ? project.property("APP_VERSION_NAME")
        : project.hasProperty("DUODIAN_APP_VERSION_NAME")
        ? project.property("DUODIAN_APP_VERSION_NAME")
        : rootProject.ext.versionName
def duodianStringProperty = { name, defaultValue ->
    (project.findProperty(name) ?: defaultValue).toString()
}
def duodianBuildConfigString = { value ->
    def escaped = value.replace("\\", "\\\\").replace("\"", "\\\"")
    "\"${escaped}\""
}
def apkChannel = duodianStringProperty("DUODIAN_APK_CHANNEL", "main")
def engineApplicationId = duodianStringProperty("DUODIAN_ENGINE_APPLICATION_ID", "com.zhirang.zhanghaoguanjia.engine")
def engineDataRootName = duodianStringProperty("DUODIAN_ENGINE_DATA_ROOT_NAME", "blackbox")
def engineDisplayName = duodianStringProperty("DUODIAN_ENGINE_NAME", "@string/engine_app_name")

android {
    namespace 'top.niunaijun.blackbox'

    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion = "29.0.13846066"

    buildFeatures {
        aidl true
        buildConfig true
        prefab true
    }

    defaultConfig {
        applicationId engineApplicationId
        minSdkVersion rootProject.ext.minSdk
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode engineVersionCodeOverride.toString().toInteger()
        versionName engineVersionNameOverride.toString()
        buildConfigField "String", "APK_CHANNEL", duodianBuildConfigString(apkChannel)
        buildConfigField "String", "ENGINE_DATA_ROOT_NAME", duodianBuildConfigString(engineDataRootName)
        manifestPlaceholders = [
                engineLabel         : engineDisplayName,
                engineBindPermission: "${engineApplicationId}.permission.BIND_ENGINE",
                engineTaskAffinity  : "${engineApplicationId}.task_affinity"
        ]

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        multiDexEnabled true
        multiDexKeepProguard file('multidex-config.pro')
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }
        ndkVersion = "29.0.13846066"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:-deprecation" << "-Xlint:-unchecked" << "-Xlint:-rawtypes"
        options.fork = true
        options.forkOptions.jvmArgs << "-Xmx2048m"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", 'RestrictedApi'
        textOutput "stdout"
        textReport false
        checkOnly 'NewApi', 'InlinedApi'
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "FxEngine_${variant.versionName}_${output.baseName}.apk"
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation project(':engine-aidl')
    implementation(project(":black-reflection"))
    annotationProcessor(project(":compiler"))
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.moandjiezana.toml:toml4j:0.7.2'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
