plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

def duodianStringProperty = { name, defaultValue ->
    (project.findProperty(name) ?: defaultValue).toString()
}

def duodianBuildConfigString = { value ->
    def escaped = value.replace("\\", "\\\\").replace("\"", "\\\"")
    "\"${escaped}\""
}

def apkChannel = duodianStringProperty("DUODIAN_APK_CHANNEL", "main")
def appApplicationId = duodianStringProperty("DUODIAN_APP_APPLICATION_ID", "com.zhirang.zhanghaoguanjia")
def engineApplicationId = duodianStringProperty("DUODIAN_ENGINE_APPLICATION_ID", "com.zhirang.zhanghaoguanjia.engine")

android {

    namespace 'com.zhirang.zhanghaoguanjia'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion = "29.0.13846066"
    defaultConfig {
        applicationId appApplicationId
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        buildConfigField "String", "API_BASE_URL", duodianBuildConfigString(duodianStringProperty("DUODIAN_API_BASE_URL", "http://dpgj.zrnh.cn/api/"))
        buildConfigField "String", "APK_CHANNEL", duodianBuildConfigString(apkChannel)
        buildConfigField "String", "ENGINE_PACKAGE", duodianBuildConfigString(engineApplicationId)
        manifestPlaceholders = [
                appFileProviderAuthority: "${appApplicationId}.fileprovider",
                engineBindPermission    : "${engineApplicationId}.permission.BIND_ENGINE"
        ]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        splits {
            abi {
                enable true
                reset()
                
                include 'armeabi-v7a', "arm64-v8a"
                universalApk true
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    kotlinOptions {
        jvmTarget = '21'
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "zhanghaoguanjia_${variant.versionName}_${output.baseName}.apk"
        }
    }

    sourceSets {
        main {
            assets {
                srcDirs += ['src/main/assets']
            }
        }
    }
}

// Dynamically create copy tasks per variant to handle both debug and release engine APKs
android.applicationVariants.configureEach { variant ->
    def copyTask = tasks.register("copyEngineApk${variant.name.capitalize()}", Copy) {
        from "${project(':Bcore').buildDir}/outputs/apk/${variant.buildType.name}"
        into "src/main/assets/engine/"
        include "FxEngine_${variant.versionName}_${variant.buildType.name}.apk"
        rename { "engine-base.apk" }
    }
    copyTask.get().dependsOn ":Bcore:assemble${variant.buildType.name.capitalize()}"
    variant.preBuildProvider.get().dependsOn copyTask
}

