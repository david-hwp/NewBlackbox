services:
  duodian-mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: duodian_admin
      MYSQL_USER: ${MYSQL_USER:-duodian}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-duodian123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --default-authentication-plugin=mysql_native_password
    expose:
      - "3306"
    volumes:
      - duodian-mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - duodian-admin

  duodian-mysql-backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: admin-duodian-mysql-backup
    restart: unless-stopped
    depends_on:
      duodian-mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: duodian-mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASS: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DB: duodian_admin
      MYSQL_BACKUP_INTERVAL_SECONDS: ${MYSQL_BACKUP_INTERVAL_SECONDS:-86400}
      MYSQL_BACKUP_MAX_BACKUPS: ${MYSQL_BACKUP_MAX_BACKUPS:-30}
      MYSQL_BACKUP_INIT: ${MYSQL_BACKUP_INIT:-1}
      TZ: Asia/Shanghai
    volumes:
      - ${DUODIAN_DATA_DIR}/db_backup:/backup
    networks:
      - duodian-admin

  duodian-backend:
    build:
      context: ..
      dockerfile: admin/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      duodian-mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://duodian-mysql:3306/duodian_admin?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-duodian}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-duodian123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: never
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-200MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-220MB}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${DUODIAN_FRONTEND_PORT:-8006},http://127.0.0.1:${DUODIAN_FRONTEND_PORT:-8006}
      APP_STORAGE_TYPE: ${APP_STORAGE_TYPE:-local}
      APP_STORAGE_LOCAL_ROOT: ${APP_STORAGE_LOCAL_ROOT:-/zhanghaoguanjia/files/}
      APP_STORAGE_ENDPOINT: ${APP_STORAGE_ENDPOINT:-}
      APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET:-}
      APP_STORAGE_REGION: ${APP_STORAGE_REGION:-}
      APP_STORAGE_ACCESS_KEY: ${APP_STORAGE_ACCESS_KEY:-}
      APP_STORAGE_SECRET_KEY: ${APP_STORAGE_SECRET_KEY:-}
      APP_STORAGE_PUBLIC_BASE_URL: ${APP_STORAGE_PUBLIC_BASE_URL:-}
      APP_STORAGE_ADDRESSING_STYLE: ${APP_STORAGE_ADDRESSING_STYLE:-path}
      APP_CLONE_AUTH_PRIVATE_KEY: ${APP_CLONE_AUTH_PRIVATE_KEY:?APP_CLONE_AUTH_PRIVATE_KEY is required}
      APP_RELEASE_BACKEND_BASE_URL: ${APP_RELEASE_BACKEND_BASE_URL:-http://duodian-backend:8080/api}
      APP_RELEASE_RUNNER: ${APP_RELEASE_RUNNER:-noop}
      APP_RELEASE_SCRIPT_PATH: ${APP_RELEASE_SCRIPT_PATH:-/app/admin/scripts/release-channel-apk.sh}
      APP_RELEASE_REPO_URL: ${APP_RELEASE_REPO_URL:-}
      APP_RELEASE_DRY_RUN: ${APP_RELEASE_DRY_RUN:-false}
      APP_RELEASE_PUSH_RELEASE_BRANCH: ${APP_RELEASE_PUSH_RELEASE_BRANCH:-true}
      APP_RELEASE_WORK_ROOT: ${APP_RELEASE_WORK_ROOT:-/tmp/duodian-release-channel-apk}
      APP_RELEASE_LOCK_DIR: ${APP_RELEASE_LOCK_DIR:-/tmp/duodian-release-channel-apk-locks}
      APP_RELEASE_API_BASE_URL: ${APP_RELEASE_API_BASE_URL:-http://dpgj.zrnh.cn/api/}
      APP_RELEASE_WORKER_URL: ${APP_RELEASE_WORKER_URL:-}
      APP_RELEASE_WORKER_TOKEN: ${APP_RELEASE_WORKER_TOKEN:-}
      APP_RELEASE_WORKER_BACKEND_BASE_URL: ${APP_RELEASE_WORKER_BACKEND_BASE_URL:-}
      APP_ZR_CONTROL_URL: ${APP_ZR_CONTROL_URL:-http://47.112.170.106:14501}
      APP_ZR_STREAM_URL: ${APP_ZR_STREAM_URL:-/zr-stream/}
      LOGGING_FILE_NAME: /zhanghaoguanjia/logs/backend.log
      TZ: Asia/Shanghai
    expose:
      - "8080"
    volumes:
      - ${DUODIAN_DATA_DIR}/files:/zhanghaoguanjia/files
      - ${DUODIAN_DATA_DIR}/logs:/zhanghaoguanjia/logs
    networks:
      - duodian-admin

  duodian-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - duodian-backend
    ports:
      - "${DUODIAN_FRONTEND_PORT:-8006}:80"
    volumes:
      - ${DUODIAN_DATA_DIR}/logs:/var/log/nginx/zhanghaoguanjia
    networks:
      - duodian-admin

networks:
  duodian-admin:
    driver: bridge

volumes:
  duodian-mysql-data:
