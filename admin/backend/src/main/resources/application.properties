server.port=8080
server.servlet.context-path=/api
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/duodian_admin?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=duodian
spring.datasource.password=duodian123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable SQL script initialization (JPA handles schema)
spring.sql.init.mode=never

# CORS
app.cors.allowed-origins=http://localhost:8006,http://localhost:5173,http://localhost:3000

# External system callback token. Keep the real value in environment-specific secrets only.
app.external-callback.token=${APP_EXTERNAL_CALLBACK_TOKEN:}

# Review callout callback and phone-balance billing. Keep real callback token in environment only.
app.review-callout.callback.enabled=${APP_REVIEW_CALLOUT_CALLBACK_ENABLED:false}
app.review-callout.callback.token=${APP_REVIEW_CALLOUT_CALLBACK_TOKEN:}
app.review-callout.callback.accept-query-token=${APP_REVIEW_CALLOUT_CALLBACK_ACCEPT_QUERY_TOKEN:true}
app.review-callout.billing.mode=${APP_REVIEW_CALLOUT_BILLING_MODE:BILLED_MINUTES}
app.review-callout.billing.rate-units-per-minute=${APP_REVIEW_CALLOUT_BILLING_RATE_UNITS_PER_MINUTE:1}
app.review-callout.billing.minimum-charge-units=${APP_REVIEW_CALLOUT_BILLING_MINIMUM_CHARGE_UNITS:1}

# File upload
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=220MB
app.storage.type=local
app.storage.local-root=${user.home}/zhanghaoguanjia/files/
app.storage.endpoint=
app.storage.bucket=
app.storage.region=
app.storage.access-key=
app.storage.secret-key=
app.storage.public-base-url=

# Logging
logging.level.com.duodian=DEBUG

# Release job runner. Production defaults to noop unless explicitly configured.
app.release.runner=${APP_RELEASE_RUNNER:noop}
app.release.worker-url=${APP_RELEASE_WORKER_URL:}
app.release.worker-token=${APP_RELEASE_WORKER_TOKEN:}
app.release.worker-backend-base-url=${APP_RELEASE_WORKER_BACKEND_BASE_URL:}
app.release.repo-url=${APP_RELEASE_REPO_URL:}
app.release.api-base-url=${APP_RELEASE_API_BASE_URL:http://dpgj.zrnh.cn/api/}
app.release.dry-run=${APP_RELEASE_DRY_RUN:false}
app.release.push-release-branch=${APP_RELEASE_PUSH_RELEASE_BRANCH:true}
app.release.work-root=${APP_RELEASE_WORK_ROOT:}
app.release.lock-dir=${APP_RELEASE_LOCK_DIR:}
app.release.backend-base-url=${APP_RELEASE_BACKEND_BASE_URL:}

# ZR remote browser authorization bridge.
app.zr.control-url=${APP_ZR_CONTROL_URL:http://47.112.170.106:14501}
app.zr.stream-url=${APP_ZR_STREAM_URL:/zr-stream/}
