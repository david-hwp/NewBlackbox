server.port=8080
server.servlet.context-path=/api

# H2 In-Memory Database (for testing)
spring.datasource.url=jdbc:h2:mem:duodian_admin;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.storage.type=local
app.storage.local-root=${user.home}/zhirang/duokai/
app.storage.endpoint=
app.storage.bucket=
app.storage.region=
app.storage.access-key=
app.storage.secret-key=
app.storage.public-base-url=

# Logging
logging.level.com.duodian=DEBUG
